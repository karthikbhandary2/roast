name: roast-co

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roast_dev_password}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "127.0.0.1:5433:5432"   # host port 5433 so it won't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ./services/user/migrations:/migrations/user:ro
      - ./services/product/migrations:/migrations/product:ro
      - ./services/order/migrations:/migrations/order:ro
      - ./services/payment/migrations:/migrations/payment:ro
      - ./services/notification/migrations:/migrations/notification:ro
    healthcheck:
      # -h 127.0.0.1 matters: during first-time init Postgres runs a temporary
      # server on a unix socket only, so a socket check would report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI

  user-service:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: user
        GO_VERSION: ${GO_VERSION:-1.25}
    environment:
      GRPC_ADDR: ":9001"
      DATABASE_URL: postgres://${POSTGRES_USER:-roast}:${POSTGRES_PASSWORD:-roast_dev_password}@postgres:5432/user_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      KAFKA_BROKERS: kafka:9092
      OTLP_ENDPOINT: jaeger:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:9001:9001"   # for grpcurl while developing
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.go-service
      args:
        SERVICE: gateway
        GO_VERSION: ${GO_VERSION:-1.25}
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      REDIS_ADDR: redis:6379
      OTLP_ENDPOINT: jaeger:4317
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The other *_SERVICE_ADDR values default to compose service names.
      # gRPC clients connect lazily, so the gateway starts fine before
      # product/order/payment/... exist; calls to them fail until they do.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  pgdata:
