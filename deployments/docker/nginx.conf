server {
    listen 80;
    server_name localhost;

    # Dynamic proxy so nginx starts cleanly even if upstream isn't resolvable at boot
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    set $backend_upstream "http://gateway:8080/v1/";

    # Proxy API calls directly to gateway if available
    location /v1/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
