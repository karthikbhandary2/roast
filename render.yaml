# Render Blueprint specification for Roast Co.
# https://render.com/docs/blueprint-spec

services:
  # 1. Frontend - React + Vite Static Site (Free forever)
  - type: web
    name: roast-co-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: roast-co-backend
          property: host
        transform: https://{host}/v1

  # 2. Backend - Go Microservices + Gateway (Free tier)
  - type: web
    name: roast-co-backend
    runtime: docker
    dockerfilePath: deployments/render/Dockerfile
    dockerContext: .
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: roast-co-db
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: redis
          name: roast-co-redis
          property: host
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: roast-co-redis
          property: password

  # 3. Cache - Managed Redis (Free tier)
  - type: redis
    name: roast-co-redis
    ipAllowList: [] # internal access only
    plan: free

# 4. Database - Managed PostgreSQL (Free tier)
databases:
  - name: roast-co-db
    databaseName: roast_co
    user: roast_user
    plan: free
    ipAllowList: [] # internal access only
